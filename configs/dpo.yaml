defaults: [base, model/qwen2.5-1.5b]

trainer:
  kind: offline
  run_name: dpo

data:
  type: jsonl_preference
  path: data/preference_sample.jsonl
  batch_size: 4         
  shuffle: true

algorithm:
  losses:
    - type: dpo
      weight: 1.0
      beta: 0.1
      label_smoothing: 0.0

  epochs: 2
  mini_batch_size: 4
