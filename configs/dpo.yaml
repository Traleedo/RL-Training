defaults: [base, model/qwen3-0.6b]

optim:
  # DPO 对学习率比 SFT 敏感，5e-7 是常用的保守起点。
  lr: 5.0e-7

trainer:
  kind: offline

data:
  type: jsonl_preference
  path: data/preference_sample.jsonl
  # 一个样本 = 一个偏好对（chosen + rejected）。8 对就是 16 行。
  batch_size: 8
  shuffle: true

algorithm:
  losses:
    - type: dpo
      weight: 1.0
      beta: 0.1
      label_smoothing: 0.0

  epochs: 2
  # 按行切分，必须是 group_size=2 的整数倍（8 = 4 个完整的偏好对）。
  mini_batch_size: 8
