
optim:
  lr: 1.0e-3
  critic_lr: 1.0e-2
  weight_decay: 0.0
  grad_clip: 1.0
  lr_scheduler: constant      # constant / cosine / linear

loggers:
  - type: console
    every_n_steps: 1

checkpointer:
  type: local
  save_dir: checkpoints/smoke
  every_n_steps: 0            # 0 = 只手动存；>0 = 每 N 步自动存

trainer:
  device: auto
  total_steps: 10
  seed: 42
  run_name: skeleton
  kind: rl
