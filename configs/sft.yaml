defaults: [base, model/qwen3-0.6b]

optim:
  # 全量 SFT 的常用量级；比 base 里的 RL 学习率高一个数量级。
  lr: 1.0e-5

trainer:
  kind: offline

data:
  type: jsonl_sft
  path: data/sft_sample.jsonl
  batch_size: 8
  shuffle: true

algorithm:
  losses:
    - type: cross_entropy
      weight: 1.0
      reduction: token_mean
  epochs: 2
  mini_batch_size: 8
