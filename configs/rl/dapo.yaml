
defaults: [../base, ../model/qwen3-0.6b]

rollout:
  num_generations: 8

reward:
  scorer:
    type: hf_reward_model
  processors:
    - type: dynamic_filter
      eps: 1.0e-6
    - type: group_normalize

algorithm:
  advantage:
    type: broadcast

  losses:
    - type: policy_gradient
      weight: 1.0
      reduction: token_mean
      clip_eps_low: 0.2
      clip_eps_high: 0.28
    - type: kl_k3
      weight: 1.0
      coef: 0.0

  epochs: 2
  mini_batch_size: 8
