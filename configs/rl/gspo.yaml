
defaults: [../base, ../model/qwen3-0.6b]

rollout:
  num_generations: 8

reward:
  scorer:
    type: hf_reward_model
  processors:
    - type: group_normalize

algorithm:
  advantage:
    type: broadcast

  losses:
    - type: gspo
      weight: 1.0
      clip_eps: 3.0e-4

    - type: kl_k3
      weight: 1.0
      coef: 0.01

  epochs: 2
  mini_batch_size: 8
