
defaults: [../base, ../model/qwen3-0.6b]

rollout:
  num_generations: 1

reward:
  scorer:
    type: hf_reward_model
  processors:
    - type: global_normalize

algorithm:
  advantage:
    type: gae
    gamma: 0.99
    lam: 0.95

  losses:
    - type: ppo_clip
      weight: 1.0
      clip_eps: 0.2

    - type: value_loss
      weight: 0.5
      clip_eps: 0.2
    - type: kl_k3
      weight: 1.0
      coef: 0.01
  controllers:
    - type: adaptive_kl
      term: kl_k3
      target_kl: 0.02       
      step_size: 1.0        
      beta_min: 0.0
      beta_max: 1.0

  epochs: 2
  mini_batch_size: 8
