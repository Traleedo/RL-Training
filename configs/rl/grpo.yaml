
defaults: [../base, ../model/qwen3-0.6b]

rollout:
  # 组内样本数。必须 >= 2，否则组内没有方差、advantage 恒为 0。
  # 8 个比 4 个的组内均值/标准差估计稳得多，显存也仍然够。
  num_generations: 8

reward:
  scorer:
    type: hf_reward_model
  processors:
    - type: group_normalize

algorithm:
  advantage:
    type: broadcast

  losses:
    - type: policy_gradient
      weight: 1.0
      reduction: seq_mean
    - type: kl_k3
      weight: 1.0
      coef: 0.01

  epochs: 2
  # 等于 num_generations，保证每个 mini-batch 恰好是一整组。
  mini_batch_size: 8
