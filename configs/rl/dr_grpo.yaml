
defaults: [../base, ../model/qwen3-0.6b]

rollout:
  num_generations: 8

reward:
  scorer:
    type: hf_reward_model
  processors:
    - type: group_normalize
      divide_std: false

algorithm:
  advantage:
    type: broadcast

  losses:
    - type: policy_gradient
      weight: 1.0
      reduction: seq_sum

    - type: kl_k3
      weight: 1.0
      coef: 0.01

  epochs: 2
  mini_batch_size: 8
