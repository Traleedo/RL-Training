
defaults: [../base, ../model/qwen3-0.6b]

rollout:
  num_generations: 1

reward:
  scorer:
    type: hf_reward_model
  processors:
    - type: global_normalize

algorithm:
  advantage:
    type: gae
    gamma: 0.99
    lam: 0.95

  losses:
    - type: ppo_clip
      weight: 1.0
      clip_eps: 0.2

    - type: value_loss
      weight: 0.5
      clip_eps: 0.2
    - type: kl_k1
      weight: 1.0
      coef: 0.01

  epochs: 2
  mini_batch_size: 8
