

model:
  # 真实基座换成 Qwen/Qwen3-0.6B 之类；fixture 组件会忽略这个字段。
  name_or_path: tiny-fixture
  dtype: float32

# actor 的构造参数。rollout 与 actor 共享同一个模型对象，所以不需要在这里
# 重复配置模型维度。
actor:
  type: fixture_tiny
  vocab_size: &vocab 64
  d_model: 32
  nhead: 2
  n_layers: 1
  max_positions: 64

# critic 与 reference 的配置**一直留在这里**，但它们不一定会被构建 ——
# 要不要真的加载，由 plan_assembly 根据各组件的 requires 并集决定。
# 「配置里写了某一行」不等于「那个模型会被加载」，这是本框架的核心机制。
critic:
  type: fixture_tiny_value
  vocab_size: *vocab
  d_model: 32
  nhead: 2
  n_layers: 1
  max_positions: 64

reference:
  type: fixture_tiny_frozen
  vocab_size: *vocab
  d_model: 32
  nhead: 2
  n_layers: 1
  max_positions: 64

rollout:
  # 基座只给「怎么生成」；「生成几条」是算法的事（num_generations），
  # 由各算法配置覆盖。OmegaConf 按键 deep-merge，两边都保得住。
  type: fixture_tiny
  vocab_size: *vocab
  max_new_tokens: 4
  temperature: 1.0
  top_p: 1.0

# 奖励模型。只有在算法配置里把 reward.scorer.type 写成 hf_reward_model 时，
# 这一段才会被注入给 scorer（与 model 段注入给 actor 完全同一个模式）。
# 下面留的是空壳：fixture 基座用不上，写死一个真实 name_or_path 反而会误导。
# 用 --reward-model 覆盖，或照 configs/model/qwen3-0.6b.yaml 的样子填。
reward_model:
  name_or_path: null
  dtype: float32
  batch_size: 16
  scale: 1.0
