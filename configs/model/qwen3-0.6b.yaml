model:
  name_or_path: Qwen/Qwen3-0.6B
  dtype: bfloat16
  attn_implementation: flash_attention_2   # 没装 flash-attn 就删掉这一行
  trust_remote_code: false
  local_files_only: false

actor:
  type: hf_causal_lm

# 共享骨架的 critic：从 actor 的底座复制一份，接一个 nn.Linear(hidden, 1)。
# freeze_backbone: false = 骨架与 head 一起训（PPO 标准做法，critic 从策略的
# 初始权重出发，之后独立演化）。
critic:
  type: hf_shared_value
  freeze_backbone: false

reference:
  type: hf_frozen

rollout:
  type: hf
  max_new_tokens: 512
  temperature: 1.0
  top_p: 1.0
  do_sample: true
  recompute_logprobs: true

reward_model:
  name_or_path: Skywork/Skywork-Reward-V2-Qwen3-8B
  dtype: bfloat16
  batch_size: 16
  scale: 1.0
