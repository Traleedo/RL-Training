model:
  name_or_path: Qwen/Qwen3-0.6B
  dtype: bfloat16
  # sdpa 是 torch 自带的，任何环境都能跑；装好 flash-attn 后可换成
  # flash_attention_2 提速。
  attn_implementation: sdpa
  trust_remote_code: false
  local_files_only: false

actor:
  type: hf_causal_lm

critic:
  type: hf_shared_value
  freeze_backbone: false

reference:
  type: hf_frozen

rollout:
  type: hf
  max_new_tokens: 512
  temperature: 1.0
  top_p: 1.0
  do_sample: true
  recompute_logprobs: true

reward_model:
  name_or_path: Skywork/Skywork-Reward-V2-Qwen3-8B
  dtype: bfloat16
  # 8B 奖励模型单独占 ~16GB；batch 8 在 48GB 卡上与 actor/reference 同驻比较稳。
  batch_size: 8
  scale: 1.0
